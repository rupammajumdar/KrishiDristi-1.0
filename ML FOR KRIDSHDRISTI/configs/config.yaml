# ============================================================
# KRIDSHDRISTI — Satellite-based Agri & Water Monitoring Config
# ============================================================

project:
  name: "KRIDSHDRISTI"
  description: "Smart India Hackathon PS85 — Satellite-based crop & water monitoring"
  region: "India"  # override per-tile or per-aoi

# ---- Data source ------------------------------------------------
data:
  satellite: "sentinel-2"           # sentinel-2 | landsat-8 | landsat-9 | modis
  resolution: 10                    # metres (Sentinel-2 B4/B3/B2)
  bands:
    sentinel-2:
      blue: "B02"
      green: "B03"
      red: "B04"
      nir: "B08"
      swir1: "B11"
      swir2: "B12"
      qa: "SCL"                     # Scene Classification Layer
    landsat-8:
      blue: "B2"
      green: "B3"
      red: "B4"
      nir: "B5"
      swir1: "B6"
      swir2: "B7"
      qa: "QA_PIXEL"
  time_range:
    start: "2023-01-01"
    end: "2025-12-31"
    temporal_resolution: "10D"       # compositing window
  aoi:
    # Bounding box [west, south, east, north] in EPSG:4326
    bbox: [72.0, 8.0, 88.0, 28.0]   # approximate India extent
    # For quick testing use a smaller tile, e.g. a district
    # bbox: [77.5, 28.4, 77.8, 28.7]

# ---- Preprocessing ---------------------------------------------
preprocessing:
  cloud_masking: true
  cloud_probability_threshold: 40    # for sen2cor / s2cloudless
  resampling:
    target_resolution: 10            # metres
    method: "bilinear"              # bilinear | nearest
  reprojection:
    target_crs: "EPSG:32643"        # UTM Zone 43N (central India)
  tile_handling:
    merge_strategy: "vrt"           # vrt | mosaic
    nodata_value: 0

# ---- Vegetation indices -----------------------------------------
indices:
  ndvi:
    nir: "B08"
    red: "B04"
  ndwi:
    green: "B03"
    nir: "B08"
  mndwi:
    green: "B03"
    swir: "B11"
  evi:
    nir: "B08"
    red: "B04"
    blue: "B02"
    gain: 2.5
    offset: 1.0
    lintresh: 0.1

# ---- Stress thresholds ------------------------------------------
stress_thresholds:
  ndvi:
    healthy: [0.4, 1.0]
    moderate_stress: [0.2, 0.4]
    severe_stress: [-1.0, 0.2]
  ndwi:
    water: [0.3, 1.0]
    moist_soil: [0.0, 0.3]
    dry: [-1.0, 0.0]

# ---- Models -----------------------------------------------------
models:
  water_segmentation:
    architecture: "unet"
    in_channels: 4          # Green, NIR, SWIR1, NDWI
    base_filters: 32
    depth: 4
    pretrained: false
    checkpoint: "checkpoints/unet_water_best.pth"
  anomaly_detection:
    architecture: "lstm"
    input_dim: 4            # NDVI, NDWI, EVI, water_extent
    hidden_dim: 64
    num_layers: 2
    sequence_length: 12     # time steps (e.g. 12 composites = 120 days)
    dropout: 0.2
    checkpoint: "checkpoints/lstm_anomaly_best.pth"
  vegetation_stress:
    method: "threshold+rf"  # threshold+rf | cnn | none
    rf_n_estimators: 200
    rf_max_depth: 15

# ---- Training ---------------------------------------------------
training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.001
  val_split: 0.2
  early_stopping_patience: 10
  device: "auto"            # auto | cpu | cuda

# ---- Outputs ----------------------------------------------------
outputs:
  map_format: "geotiff"     # geotiff | png | both
  report_format: "pdf"      # pdf | html
  animation_fps: 2
  anomaly_scorecard: true
  per_location_reports: true
