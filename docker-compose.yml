version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: krishidristi_db
    environment:
      POSTGRES_USER: krishidristi
      POSTGRES_PASSWORD: krishidristi_secret
      POSTGRES_DB: krishidristi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishidristi -d krishidristi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krishidristi_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
